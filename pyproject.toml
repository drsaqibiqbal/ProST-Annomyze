[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prostate-deid"
dynamic = ["version"]
description = "De-identification and anatomical masking for prostate MRI, behind one auditable Compose-style pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Saqib Iqbal", email = "TODO@example.com"},
]
keywords = [
    "medical imaging",
    "de-identification",
    "DICOM",
    "prostate MRI",
    "privacy",
    "pseudonymization",
    "anatomical masking",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.26",
    "pydicom>=3.0",
    "nibabel>=5.0",
    "Pillow>=10.1",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
vit = ["torch>=2.2", "transformers>=4.40"]
codecs = ["pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.1", "pylibjpeg-openjpeg>=2.3", "pylibjpeg-rle>=2.0"]
dashboard = ["streamlit>=1.50", "pytesseract>=0.3.10", "pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.1",
             "pylibjpeg-openjpeg>=2.3", "pylibjpeg-rle>=2.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/drsaqibiqbal/ProST-Annomyze"
Documentation = "https://drsaqibiqbal.github.io/annolib/"
Repository = "https://github.com/drsaqibiqbal/ProST-Annomyze"
"Bug Tracker" = "https://github.com/drsaqibiqbal/ProST-Annomyze/issues"
Changelog = "https://github.com/drsaqibiqbal/ProST-Annomyze/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "src/prostate_deid/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prostate_deid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# line-length above is the formatting target; long lines are not a CI failure (numeric
# constants, log/audit messages and LaTeX strings read better unwrapped).
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
