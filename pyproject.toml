[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prostate-deid"
version = "0.1.0"
description = "De-identification and anatomical masking for prostate MRI, behind one auditable Compose-style pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Saqib Iqbal", email = "TODO@example.com"},
]
keywords = [
    "medical imaging",
    "de-identification",
    "DICOM",
    "prostate MRI",
    "privacy",
    "pseudonymization",
    "anatomical masking",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.26",
    "pydicom>=2.4",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "spacy>=3.7"]
dashboard = ["streamlit>=1.35"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/drsaqibiqbal/annolib"
Documentation = "https://drsaqibiqbal.github.io/annolib/"
Repository = "https://github.com/drsaqibiqbal/annolib"
"Bug Tracker" = "https://github.com/drsaqibiqbal/annolib/issues"
Changelog = "https://github.com/drsaqibiqbal/annolib/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/prostate_deid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
