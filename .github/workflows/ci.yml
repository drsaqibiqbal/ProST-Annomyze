name: CI

on:
  push:
    branches: [v3, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.10" (pyproject.toml)
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev + extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        # One version: numpy's stubs differ between the numpy releases each Python gets, so the
        # same code would type-check on one and not another. Tests still run on every version.
        if: matrix.python-version == '3.13'
        run: mypy src/

      - name: Test
        run: pytest tests/ -v --cov=prostate_deid --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  build-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
